.pill{display:inline-flex;gap:.5rem;align-items:center;border:2px solid oklch(0.42 0.16 255/.3);background:#fff;border-radius:999px;padding:.5rem 1rem;font-size:.85rem;font-weight:600;margin-bottom:1.5rem}
h1{font-size:3rem;line-height:1.15;letter-spacing:-.02em;margin:0;font-weight:700}
h2{font-size:2.1rem;line-height:1.2;margin:0;font-weight:700}
h3{font-size:1.1rem;margin:0 0 .5rem;font-weight:700}
.lead{font-size:1.25rem;color:oklch(0.22 0.10 258/.85);max-width:36rem;margin:1.25rem auto 0}
.keypts{margin-top:2rem;font-size:.85rem;font-weight:600;color:oklch(0.22 0.10 258/.75)}
.heading{text-align:center;max-width:48rem;margin:0 auto 3rem}

.g2b{grid-template-columns:1fr 1fr}
.card{background:#fff;border:2px solid oklch(0.42 0.16 255/.2);border-radius:1rem;padding:1.5rem;box-shadow:var(--shadow-card)}
.card p{margin:0;color:oklch(0.22 0.10 258/.8)}
.ico{width:3rem;height:3rem;border-radius:.6rem;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:1rem}
.num{width:2.5rem;height:2.5rem;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:1rem}
svg{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico svg{width:1.5rem;height:1.5rem}
.pr{color:var(--primary)}
.tags{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem}
.tag{display:inline-flex;gap:.4rem;align-items:center;border:2px solid oklch(0.42 0.16 255/.2);background:#fff;border-radius:999px;padding:.35rem 1rem;font-size:.85rem;font-weight:600}
.tag svg{width:1rem;height:1rem;color:var(--primary)}
.chip{display:inline-block;background:var(--primary);color:#fff;border-radius:999px;padding:.25rem .75rem;font-size:.72rem;font-weight:700;margin-bottom:.75rem}

ul.ck li{display:flex;gap:.6rem;font-size:.85rem;color:oklch(0.22 0.10 258/.85)}

ul.big li{font-size:1.1rem;gap:.8rem}ul.big li svg{width:1.5rem;height:1.5rem;margin-top:0}
.out{border-radius:1rem;padding:1.5rem;border:2px solid;box-shadow:var(--shadow-card)}
.out svg{width:2rem;height:2rem;margin-bottom:.75rem;display:block}
.out .b{display:inline-block;border-radius:999px;padding:.25rem .75rem;font-size:.72rem;font-weight:700;letter-spacing:.04em;color:#fff;margin-bottom:.75rem}
.o0{border-color:#15803d66;background:#f0fdf4}.o0 svg{color:#166534}.o0 .b{background:#166534}
.o1{border-color:#b91c1c66;background:#fef2f2}.o1 svg{color:#991b1b}.o1 .b{background:#991b1b}

.a4 .sg{margin-top:auto;border:1px solid oklch(0.42 0.16 255/.2);border-radius:.4rem;padding:.75rem;display:grid;gap:.5rem}
.a4 .sg .two{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.a4 .ln{border-bottom:1px solid rgba(0,0,0,.3);height:1rem}.a4 .bx{border:1px dashed rgba(0,0,0,.3);height:2.5rem;border-radius:.3rem}
.a4 .ft{display:flex;justify-content:space-between;margin-top:.75rem;font-size:9px;color:oklch(0.22 0.10 258/.6)}
.pdfnote{margin-top:1.5rem;font-size:.85rem;font-style:italic;color:oklch(0.22 0.10 258/.7)}

details{background:#fff;border:2px solid oklch(0.42 0.16 255/.15);border-radius:.8rem;padding:0 1.25rem;margin-bottom:.75rem}

   [0,1,2].map(i=>`<button class="btn" type="button"><i>${24+i}</i><span class="l">${svg("cart")} ${b.add}</span><small>${b.names[i]} – ${PRICES[i]} ${b.tax} – ${b.days[i]}</small></button>`).join("")+
   `<p class="tax">${b.taxN}</p></div>`;
}

  return `<figure><div class="ph" role="img" aria-label="${alt}">${svg("img")}<b>${DATA.content[lang].placeholderTitle}</b><span class="r">${s.ratio.replace("/",":")} · ${s.size}</span><span class="p">${s.prompt}</span></div><span class="mc" data-media-code="${code}">${code}</span></figure>`;
}
